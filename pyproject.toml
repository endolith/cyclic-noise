[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cyclic-noise"
version = "0.1.0"
description = "Low-pass filtered cyclic (seamlessly tiling) noise"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "endolith" }]
keywords = ["noise", "texture", "procedural", "gaussian", "loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
demo = [
    "matplotlib>=3.3",
]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/endolith/cyclic-noise"
Repository = "https://github.com/endolith/cyclic-noise"
Issues = "https://github.com/endolith/cyclic-noise/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
only-include = ["cyclic_noise.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/cyclic_noise.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/tests",
]
